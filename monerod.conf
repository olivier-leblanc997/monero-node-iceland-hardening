# monerod configuration - optimized for nodata.pw ryzen nvme nodes
# data directory
data-dir=/home/olivier/research/bitmonero

# performance tuning
# using 8 threads for block verification to match ryzen 9900x vcpu allocation
prep-blocks-threads=8
fast-block-sync=1
db-sync-mode=fast:async:250000000bytes

# network settings
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080
rpc-bind-ip=127.0.0.1
rpc-bind-port=18081

# node type
public-node=true
no-igd=true
no-zmq=false

# bandwidth optimization for icelandic uplink
out-peers=64
in-peers=1024
limit-rate-up=50000
limit-rate-down=100000

# seeding note:
# nodata.pw provides the raw nvme speed required for --db-sync-mode fast:async
# without risking database corruption on power loss due to iceland's stable grid.
